#cloud-config
# VM 첫 부팅 때 한 번 실행된다. main.tf의 custom_data로 전달된다. admin_username은 templatefile이 채운다.
# 로그: /var/log/cloud-init-output.log  /  상태: cloud-init status --long

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - git

# 비밀번호 SSH 로그인 금지(VM 설정과 이중으로 막는다)
ssh_pwauth: false

write_files:
  # 컨테이너 로그가 디스크를 채우지 않게 회전한다(컨테이너당 10MB x 3)
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }

runcmd:
  # Docker Engine과 compose 플러그인: Docker 공식 apt 저장소
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  # 관리자 계정이 sudo 없이 docker를 쓰게 한다(docker 그룹은 사실상 root 권한이라 이 계정에만 준다)
  - usermod -aG docker ${admin_username}
  - systemctl enable --now docker

final_message: "char-chat-lab cloud-init finished after $UPTIME seconds"
